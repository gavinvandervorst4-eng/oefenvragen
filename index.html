const modes=[
 ['Alles oefenen',0,60],['Begrippen',0,26],['1.0–1.1 · Jager-verzamelaars',26,35],
 ['1.2 · Jagers werden boer',35,41],['1.3 · Boeren in onze streken',41,47],
 ['1.4 · Egypte en de Nijl',47,53],['1.5 · Goden en mummies',53,60]
];
const screen=document.querySelector('#screen');
let round,index,score,missed,mode;
function shuffle(items){
 const result=[...items];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}
function focus(id){document.getElementById(id).focus();}
function home(){
 screen.innerHTML='<small>PARAGRAFEN 1.0 T/M 1.5</small><h1 id="title" tabindex="-1">Leven van de natuur</h1><p>60 meerkeuzevragen, met 26 vragen speciaal over begrippen. Kies wat je wilt oefenen. Na elk antwoord krijg je meteen uitleg.</p><div class="grid" id="modes"></div>';
 modes.forEach(([name,start,end],i)=>{
  const button=document.createElement('button');
  if(i===0)button.className='primary';
  button.textContent=name+' · '+(end-start)+' vragen';
  button.onclick=()=>begin(questions.slice(start,end),name);
  document.getElementById('modes').append(button);
 });
 focus('title');
}
function begin(items,name){
 round=items;mode=name;index=0;score=0;missed=[];showQuestion();
}
function showQuestion(){
 const [prompt,correct,b,c,d,explanation,key]=round[index];
 const options=shuffle([correct,b,c,d]);
 screen.innerHTML='<div class="bar"><small id="status"></small><button id="home">Hoofdmenu</button></div><progress aria-label="Voortgang"></progress><h2 id="prompt" tabindex="-1"></h2><figure hidden><img><figcaption>Afbeelding uit het lesboek</figcaption></figure><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" hidden></div><div class="actions"><button class="primary" id="next" hidden></button></div>';
 document.getElementById('home').onclick=home;
 document.getElementById('status').textContent=mode+' · '+(index+1)+' / '+round.length;
 const progress=screen.querySelector('progress');
 progress.max=round.length;progress.value=index;
 document.getElementById('prompt').textContent=prompt;
 if(key){
  const img=screen.querySelector('img');
  [img.alt,img.src]=photos[key];
  screen.querySelector('figure').hidden=false;
 }
 const next=document.getElementById('next');
 next.textContent=index+1===round.length?'Bekijk je score':'Volgende vraag';
 next.onclick=()=>{index++;if(index===round.length)finish();else showQuestion();};
 const choices=document.getElementById('choices');
 options.forEach((answer,i)=>{
  const button=document.createElement('button');
  const letter=document.createElement('span');
  letter.className='letter';letter.textContent='ABCD'[i];
  button.append(letter,document.createTextNode(answer));
  button.onclick=()=>{
   const right=answer===correct;
   if(right)score++;else missed.push(round[index]);
   Array.from(choices.children).forEach((choice,j)=>{
    choice.disabled=true;
    if(options[j]===correct)choice.classList.add('right');
    else if(j===i)choice.classList.add('wrong');
   });
   const feedback=document.getElementById('feedback');
   feedback.classList.add(right?'right':'wrong');
   const heading=document.createElement('strong');
   heading.textContent=right?'Goed!':'Onjuist. Het juiste antwoord is '+ 'ABCD'[options.indexOf(correct)]+'.';
   const detail=document.createElement('p');
   detail.textContent=correct;
   const why=document.createElement('p');
   why.textContent=explanation;
   feedback.append(heading,detail,why);
   feedback.hidden=false;
   progress.value=index+1;
   next.hidden=false;
   feedback.tabIndex=-1;feedback.focus();
  };
  choices.append(button);
 });
 focus('prompt');
}
function finish(){
 screen.innerHTML='<small>RONDE AFGEROND</small><h2 id="result" tabindex="-1"></h2><p id="score"></p><div class="actions"><button class="primary" id="retry">Oefen foute vragen opnieuw</button><button id="again">Herhaal deze ronde</button><button id="home">Hoofdmenu</button></div>';
 document.getElementById('result').textContent=mode;
 document.getElementById('score').textContent='Je had '+score+' van de '+round.length+' vragen goed.';
 document.getElementById('retry').hidden=missed.length===0;
 document.getElementById('retry').onclick=()=>begin(missed,'Foute vragen herhalen');
 document.getElementById('again').onclick=()=>begin(round,mode);
 document.getElementById('home').onclick=home;
 focus('result');
}
home();
</script></html>
