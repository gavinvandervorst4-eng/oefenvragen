const $=id=>document.getElementById(id);
function shuffle(items){
 const copy=[...items];
 for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
 return copy;
}
let queue=[], index=0, answers=[];
function addButton(parent,label,action,primary=false){
 const b=document.createElement('button');
 b.type='button';b.textContent=label;b.onclick=action;
 if(primary)b.className='primary';
 parent.append(b);return b;
}
function menuChapter(title,subtopics,chapter){
 const heading=document.createElement('h3');heading.textContent=title;$('menu').append(heading);
 const groups=subtopics.map(([name,questions],i)=>{
  const group=questions.map(data=>({data,name,photo:chapter===1?images[i]:forensicImages[i]}));
  addButton($('menu'),name+' · 10 vragen',()=>start(group));return group;
 });
 addButton($('menu'),'Hele hoofdstuktoets · 50 vragen',()=>start(groups.flat()),true);
}
menuChapter('Hoofdstuk 1 · Stevigheid en beweging',topics,1);
menuChapter('Hoofdstuk 2 · Onderzoek: Moord op het Darwin College',second,2);
function start(items){
 queue=shuffle(items); index=0; answers=[];
 $('home').hidden=true;$('quiz').hidden=false;show();
}
function show(){
 const item=queue[index];
 $('progress').max=queue.length;$('progress').value=index;
 $('choices').replaceChildren();$('feedback').textContent='';$('next').hidden=true;
 $('photo').hidden=!item?.photo;
 if(item?.photo)$('photo').src=item.photo;
 $('pin-form').hidden=Boolean(item);
 $('review').replaceChildren();
 $('pin').value='';
 if(!item){
  $('status').textContent='Oefening afgerond';
  $('question').textContent='Alle '+queue.length+' vragen beantwoord';
 }else{
  const [question,right,a,b]=item.data;
  $('status').textContent=item.name+' · Vraag '+(index+1)+' van '+queue.length;
  $('question').textContent=question;
  for(const answer of shuffle([right,a,b])){
   const button=addButton($('choices'),answer,()=>{
    answers[index]=answer;
    for(const option of $('choices').children)option.disabled=true;
    button.classList.add('picked');
    $('progress').value=index+1;
    $('next').textContent=index===queue.length-1?'Afronden':'Volgende vraag';
    $('next').hidden=false;$('next').focus();
   });
  }
 }
 $('question').focus();
}
$('pin-form').onsubmit=event=>{
 event.preventDefault();
 if($('pin').value!=='2468'){
  $('feedback').textContent='Deze pincode klopt niet.';$('pin').select();return;
 }
 $('pin-form').hidden=true;$('pin').value='';$('feedback').textContent='';
 const score=queue.filter(({data},i)=>data[1]===answers[i]).length;
 $('question').textContent=score+' van de '+queue.length+' goed';
 queue.forEach(({data},i)=>{
  const [question,right,,,reason]=data, correct=answers[i]===right;
  const box=document.createElement('article');
  const heading=document.createElement('h3');heading.textContent=(i+1)+'. '+question;box.append(heading);
  const result=document.createElement('p');result.textContent=correct?'Goed · '+right:'Jouw antwoord: '+answers[i]+' · Juist antwoord: '+right;box.append(result);
  if(!correct){const explanation=document.createElement('p');explanation.textContent=reason;box.append(explanation);}
  $('review').append(box);
 });
 $('question').focus();
};
$('next').onclick=()=>{index++;show();};
$('back').onclick=()=>{$('review').replaceChildren();$('quiz').hidden=true;$('home').hidden=false;$('menu').querySelector('button').focus();};
</script></html>
